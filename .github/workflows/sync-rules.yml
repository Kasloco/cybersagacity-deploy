name: Sync Rules DB

on:
  schedule:
    # Weekly: Sundays at 3:00 AM UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-sync (ignore commit SHA cache)"
        type: boolean
        default: false

# Only one sync at a time
concurrency:
  group: sync-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        run: |
          python sync.py --seed ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Show DB size
        run: |
          echo "## Sync Results — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "DB size: $(du -h data/rules.db | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "Rule count: $(sqlite3 data/rules.db 'SELECT COUNT(*) FROM rules WHERE is_active=1')" >> $GITHUB_STEP_SUMMARY
          echo "Vendor count: $(sqlite3 data/rules.db 'SELECT COUNT(*) FROM vendors WHERE rule_count > 0')" >> $GITHUB_STEP_SUMMARY

      - name: Commit and push if DB changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rules.db
          if git diff --cached --quiet; then
            echo "No changes to rules.db — skipping commit."
            echo "✅ No rule changes detected this cycle." >> $GITHUB_STEP_SUMMARY
          else
            git commit -m "Auto-sync rules.db ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            # Retry push with rebase in case another sync run pushed first
            for i in 1 2 3; do
              if git push --force-with-lease; then
                echo "🚀 rules.db updated and pushed — Vercel will auto-deploy." >> $GITHUB_STEP_SUMMARY
                break
              elif [ $i -lt 3 ]; then
                echo "Push failed (attempt $i), pulling and retrying..."
                git pull --rebase --strategy-option theirs
              else
                echo "⚠️ Push failed after 3 attempts — another sync likely already pushed." >> $GITHUB_STEP_SUMMARY
                exit 0
              fi
            done
          fi